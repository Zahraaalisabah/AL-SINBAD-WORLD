<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتجات - عالم السندباد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 800px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: var(--shadow); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .btn-delete { background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>إضافة منتج جديد</h2>
    <form id="addProductForm">
        <div class="form-group">
            <label>اسم المنتج</label>
            <input type="text" id="pTitle" required>
        </div>
        <div class="form-group">
            <label>القسم</label>
            <select id="pCategory" required>
                <option value="flowers">الورد</option>
                <option value="gifts">الهدايا</option>
                <option value="toys">الألعاب</option>
                <option value="electronics">الإلكترونيات</option>
            </select>
        </div>
        <div class="form-group">
            <label>رابط الصورة (URL أو مسار الصورة)</label>
            <input type="text" id="pImage" placeholder="images/example.jpg" required>
        </div>
        <button type="submit" class="btn">إضافة المنتج</button>
    </form>

    <h2 style="margin-top: 40px;">المنتجات الحالية</h2>
    <table class="admin-table">
        <thead>
            <tr>
                <th>الصورة</th>
                <th>اسم المنتج</th>
                <th>القسم</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="adminProductsList"></tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
